services:

  postgres-init:
    image: ghcr.io/limlyang121/my-portfolio:main
    volumes:
      - db_init:/docker-entrypoint-initdb.d
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp -r /app/Database/. /docker-entrypoint-initdb.d/"]
    user: root
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: steam-portfolio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  steam-portfolio:
    image: ghcr.io/limlyang121/my-portfolio:main
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
    restart: unless-stopped
    container_name: steam-portfolio
    networks: [default, web]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  db_init:

networks:
  web:
    external: true
