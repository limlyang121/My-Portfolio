  steam-portfolio:
    image: ghcr.io/limlyang121/my-portfolio:main
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
    restart: unless-stopped
    container_name: steam-portfolio
    networks: [default, web]          # added
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  db_init:

networks:                             # added
  web:
    external: true
